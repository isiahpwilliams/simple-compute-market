# Development overlay for the inference market: its services' identities,
# configuration file, secret overlay and registry profile, and the inference
# buyer service.
#
# Layered over compose.inference.yml, which includes compose.dev.yml for the
# dev chain. The inference end-to-end lane adds compose.inference-lane.yml, the
# compute and API-credit registries its schema-filter scenario reads:
#
#     docker compose -p simple-market-inference \
#       -f compose.inference.yml -f compose.inference-local.yml \
#       -f compose.inference-lane.yml up -d
#
# `make -C e2e-tests test-e2e-inference` does exactly this. The full local stack
# layers this file over docker-compose.yml with the VM and API-credit overlays
# instead; see that file.
#
# Every path is relative to the repository root, the project directory of every
# `-f` file, and every value it binds is committed: a well-known development
# value that must never be used on a public network; see
# dev-env/identities/README.md.

services:
  inference-registry:
    environment:
      - CONFIG_DIRECTORY=/etc/arkhai/registry
      - ACTIVE_PROFILES=inference-registry
    volumes:
      - ./dev-env/registry:/etc/arkhai/registry:ro
      - ./dev-env/identities/inference-registry.ed25519:/run/secrets/arkhai/registry-identity/credential:ro
  inference-service:
    volumes:
      - ./dev-env/identities/inference-service.ed25519:/run/secrets/arkhai/inference-service/credential:ro
  inference-gateway:
    volumes:
      - ./dev-env/identities/inference-gateway.ed25519:/run/secrets/arkhai/gateway-identity:ro
  inference-storefront:
    env_file:
      - ./dev-env/identities/inference.identity.env
    volumes:
      - ./domains/inference/storefront/storefront.inference.toml:/etc/arkhai/storefront.toml:ro
      # The wallet key.
      - ./dev-env/identities/inference.storefront.secrets.toml:/etc/arkhai/storefront.secrets.toml:ro
      # The dev chain's deployed Alkahest contract addresses, shipped with the
      # Alkahest kit. A non-Anvil deployment supplies its own address book here.
      - ./kit/alkahest/src/market_alkahest/data/alkahest_anvil_addresses.json:/app/alkahest_anvil_addresses.json:ro
  # A one-shot buyer, run by hand, as compose.vms-local.yml's buyer-cli is: its
  # Git-ignored profile and run-state directories must exist, writable by uid
  # and gid 1000, before it runs.
  inference-buyer-cli:
    image: arkhai:e2e-tests
    profiles: [buyer]
    user: "1000:1000"
    entrypoint: ["market"]
    command: ["profile", "show"]
    environment:
      XDG_CONFIG_HOME: /etc
      XDG_DATA_HOME: /var/lib/arkhai-buyer
      XDG_STATE_HOME: /var/lib/arkhai-buyer-state
    volumes:
      - ./dev-env/identities/inference-buyer.config.toml:/etc/arkhai/config.toml:ro
      - ./.e2e-buyer/inference/profile:/var/lib/arkhai-buyer/arkhai/buyer:rw
      - ./.e2e-buyer/inference/state:/var/lib/arkhai-buyer-state/arkhai:rw
      - ./dev-env/identities/buyer.eip191:/run/secrets/arkhai/buyer-credential:ro
