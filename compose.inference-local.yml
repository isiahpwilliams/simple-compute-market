# Development overlay for the inference market: the signer, wallet, and
# buyer-path bindings of the inference services.
#
# Layered over compose.inference.yml, which includes compose.dev.yml for the
# dev chain. The inference end-to-end lane adds compose.inference-lane.yml, the
# compute and API-credit registries its schema-filter scenario reads:
#
#     docker compose -p simple-market-inference --env-file <file> \
#       -f compose.inference.yml -f compose.inference-local.yml \
#       -f compose.inference-lane.yml up -d
#
# The full local stack layers this file over docker-compose.yml with the VM and
# API-credit overlays instead; see that file. Every value it binds is a
# well-known development value that must never be used on a public network;
# see dev-env/identities/README.md.

services:
  inference-registry:
    environment:
      - REGISTRY_AUTHORITY_ID=inference-registry
      - REGISTRY_AUTHORITY_SCHEME=ed25519
      - REGISTRY_AUTHORITY_IDENTIFIER=QpkX0mKYYK2PMdhAweeYEpDGzdX_htGTGmZq-L0e9r8
      - REGISTRY_AUTHORITY_CREDENTIAL_FILE=/run/secrets/arkhai/registry-identity/credential
      - REGISTRY_DESCRIPTOR_BASE_URL=http://localhost:8100
      - REGISTRY_DESCRIPTOR_DISPLAY_NAME=Local Inference Registry
      - REGISTRY_DESCRIPTOR_OPERATOR_IDENTITY=Arkhai local development
    volumes:
      - ${INFERENCE_REGISTRY_IDENTITY_CREDENTIAL_FILE:?set inference registry signer credential file}:/run/secrets/arkhai/registry-identity/credential:ro
  inference-storefront:
    env_file:
      - ${INFERENCE_IDENTITY_ENV_FILE:?set inference signer credential environment file}
      - ${INFERENCE_EVM_WALLET_ENV_FILE:?set inference EVM wallet environment file}
    environment:
      # The storefront reads its EVM key under its own Dynaconf prefix, not the
      # wallet file's AGENT_PRIV_KEY. Anvil account 0, matching `[wallet].address`
      # in storefront.inference.toml; `@str` keeps the hex from parsing as an
      # integer.
      - INFERENCE_STOREFRONT_WALLET__PRIVATE_KEY=@str 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
  inference-buyer-cli:
    image: ${INFERENCE_BUYER_IMAGE:-arkhai:e2e-tests}
    profiles: [buyer]
    user: "${INFERENCE_BUYER_UID:-1000}:${INFERENCE_BUYER_GID:-1000}"
    entrypoint: ["market"]
    command: ["profile", "show"]
    environment:
      XDG_CONFIG_HOME: /etc
      XDG_DATA_HOME: /var/lib/arkhai-buyer
      XDG_STATE_HOME: /var/lib/arkhai-buyer-state
    volumes:
      - ${INFERENCE_BUYER_CONFIG_PATH:?set buyer public config path}:/etc/arkhai/config.toml:ro
      - ${INFERENCE_BUYER_PROFILE_DIR:?set persistent buyer profile directory}:/var/lib/arkhai-buyer/arkhai/buyer:rw
      - ${INFERENCE_BUYER_STATE_DIR:?set persistent buyer run-state directory}:/var/lib/arkhai-buyer-state/arkhai:rw
      - ${INFERENCE_BUYER_CREDENTIAL_FILE:?set strict buyer credential file}:/run/secrets/arkhai/buyer-credential:ro
