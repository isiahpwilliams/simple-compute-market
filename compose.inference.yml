# Inference market on the local dev chain — standalone bring-up: the shared
# Anvil chain and the inference domain stack, with no VM or API-credits
# services. See domains/inference/compose.yml.
#
# This file composes base topology only, and its services refuse to start alone.
# The development identities, configuration, secret overlay, registry profile
# and buyer service live in compose.inference-local.yml, layered with `-f`
# because an including file cannot redefine a service it imported:
#
#     docker compose -f compose.inference.yml -f compose.inference-local.yml up -d
include:
  - compose.dev.yml
  - domains/inference/compose.yml
