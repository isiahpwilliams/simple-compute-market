# Full multi-domain local stack (the default `docker compose` target).
#
# Assembles every market domain on one shared dev chain: Anvil, the VM compute
# market, the API-credits market, and the inference market together.
#
# Domains are independent: each end-to-end lane brings up one domain's stack
# instead (`make -C e2e-tests test-e2e-vm`, `test-e2e-bare-metal`,
# `test-e2e-apicredits`, `test-e2e-inference`).
#
# The domain wrappers include compose.dev.yml, so this file includes the VM
# wrapper and the API-credits and inference domain files, never their
# wrappers: the chain enters once.
include:
  - compose.vms.yml
  - domains/apicredits/compose.yml
  - domains/inference/compose.yml

# This file composes base topologies only. The development signer, wallet, and
# buyer-path bindings live in compose.vms-local.yml and
# compose.apicredits-local.yml, layered with `-f` because an including file
# cannot redefine a service it imported. A bare `docker compose up` here
# therefore refuses to start: every signing credential is a required
# variable. Pass the overlays with the values `make e2e-dev-identities-env`
# prints:
#
#     make -s --no-print-directory e2e-dev-identities-env > .e2e-identities.env
#     docker compose --env-file .e2e-identities.env -f docker-compose.yml \
#       -f compose.vms-local.yml -f compose.apicredits-local.yml \
#       -f compose.inference-local.yml up -d
