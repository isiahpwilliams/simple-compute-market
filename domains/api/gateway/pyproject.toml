[project]
name = "arkhai-api-gateway"
version = "0.1.0"
license = "MIT"
description = "The api family's gateway: an OpenAI-style reverse proxy that admits a model server's requests through the bearer gate."
requires-python = ">=3.12,<3.14"
dependencies = [
  # The separable verify and charge steps the gateway orders its check between.
  "arkhai-api-gate[signed]>=0.2.0",
  "fastapi>=0.115.0",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  # The streaming test serves the app over a real socket; the library itself
  # serves nothing, so the executable that runs it declares the server.
  "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arkhai_api_gateway"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
