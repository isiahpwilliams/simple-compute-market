[project]
name = "arkhai-inference-domain"
version = "0.2.0"
license = "MIT"
description = "Shared inference domain models, pricing, usage vocabulary, negotiation policies, issuance client, and market-domain contract."
requires-python = ">=3.12,<3.14"
dependencies = [
    "arkhai-core>=0.4.0",
    "arkhai-kit-policy",
    "arkhai-kit-alkahest>=0.4.0",
    "arkhai-kit-identity==0.4.0",
    "httpx>=0.27",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/arkhai_inference"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    # `schema` is a signed wire key, so it keeps its name despite shadowing
    # Pydantic's deprecated method.
    "ignore:Field name \"schema\".*shadows an attribute:UserWarning:arkhai_inference.settlement.credits_client",
    "ignore:Field name \"schema\".*shadows an attribute:UserWarning:arkhai_inference.settlement.issuance_evidence",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.8,<1.0.0",
]
