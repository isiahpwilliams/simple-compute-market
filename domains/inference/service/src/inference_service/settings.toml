# ---------------------------------------------------------------------------
# Inference service base defaults.
# This file documents all supported configuration keys and their defaults.
# Do NOT put environment-specific values here.
#
# Override via (highest priority first):
#   1. INFERENCE_* environment variables
#   2. config/config-<profile>.yml  (selected by ACTIVE_PROFILES)
#   3. config/config.yml
#   4. This file
# ---------------------------------------------------------------------------

# HTTP server
host = "0.0.0.0"
port = 8086
log_level = "info"

# Database
# This service's own database, shared with no other service. Defaults to
# SQLite so a fresh checkout works without any setup.
database_url = "sqlite:///inference.db"

# ---------------------------------------------------------------------------
# Marketplace identity
#
# This service is a site authority: it verifies its callers' signed requests
# and signs its own responses, refusals included. Both a signing credential
# and at least one trusted role are required; the service refuses to start
# without them, since it has no other gate.
# ---------------------------------------------------------------------------
site_signing_key_file = ""

# The principal this credential must own. Pinning it here makes a wrong
# credential a startup failure rather than a service that signs every response
# as someone no counterparty pinned.
site_principal = ""

# Seconds a request timestamp may differ from this service's clock.
max_timestamp_skew = 300

# Who may call, by role. Each entry is a scheme/identifier pair.
#
# A role with no entries is not "trust anybody" -- a request in that role is
# refused, naming the missing configuration. `seller` is the inference
# storefront, `service` is the inference gateway that spends request credits,
# and `admin` is for manual operation and is held by an operator, not by
# either component.
[trusted_principals]
# Empty here on purpose. Dynaconf merges rather than replaces, so a principal
# listed here would be added to whatever a deployment configures and could not
# be removed by overriding it. Real principals are supplied per deployment.
#
# The scheme matters: the storefront signs eip191 while the gateway signs
# ed25519. At most two principals per role, which is what `TrustedIdentitySet`
# admits -- enough for a rotation and no more.
seller = []
service = []
admin = []
