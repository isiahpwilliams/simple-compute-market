# Inference seller — local docker-compose stack.
# Anvil default account #8; deterministic local chain. DO NOT use these
# keys on any public network.
#
# Mounted into the inference-storefront container at
# /etc/arkhai/storefront.toml (XDG_CONFIG_HOME=/etc).

agent_id      = "inferenceseller"
port          = 8000
base_url      = "http://inference-storefront:8000/"
db_path       = "/app/data/storefront.db"

# Stated explicitly because this profile replaces the shipped defaults rather
# than layering over them, and `server.py` reads the key unconditionally.
enable_registry_discovery = true

[identity]
scheme     = "eip191"
identifier = "0x23618e81e3f5cdf7f54c3d65f7fbc0abf5b21e8f"

[identity.admin_principals]
identities = [
  { scheme = "eip191", identifier = "0x23618e81e3f5cdf7f54c3d65f7fbc0abf5b21e8f" },
]

[wallet]
address     = "0x23618e81E3f5cdF7f54C3d65f7FBc0aBf5B21E8f"
private_key = "" # INFERENCE_STOREFRONT_WALLET__PRIVATE_KEY secret environment input

# Alkahest is the only mechanism this storefront registers; naming another
# here fails startup.
[settlement]
schema_version = 1
priority = ["alkahest.v1"]

[settlement.alkahest]
enabled = true
address_config_path = "/app/alkahest_anvil_addresses.json"
oracle_gated = false
trusted_oracle_addresses = []

[chains.anvil]
rpc_url  = "ws://anvil:8545"
chain_id = 31337
alkahest_address_config_path = "/app/alkahest_anvil_addresses.json"

[registry]
# Only the inference registry: this seller's listings speak the inference
# schema, and the buyer plugin's schema filter routes discovery to it.
urls              = ["http://inference-registry:8080"]
discovery_timeout = 5.0

[registry.authorities."http://inference-registry:8080"]
authority = "inference-registry"
# Public half of dev-env/identities/inference-registry.ed25519.
identities = [
  { scheme = "ed25519", identifier = "QpkX0mKYYK2PMdhAweeYEpDGzdX_htGTGmZq-L0e9r8" },
]

[credits]
# The inference authority this storefront sells for; it also hosts the quota
# ledger selected below.
service_url         = "http://inference-service:8082"
admin_key_file      = "/run/secrets/arkhai/inference-admin-key"
preflight_timeout   = 60
fail_on_unreachable = true

[capacity]
poll_interval = 1
seed_site     = "default"

[capacity.sites.default]
url = "http://inference-service:8082"

[capacity.sites.default.expected_authorities]
# Public half of dev-env/identities/inference-service.ed25519. Pinned again
# under [credits.expected_authorities]; a test asserts the two agree.
identities = [
  { scheme = "ed25519", identifier = "nS5GC-Q7uZtXKg2sep2iHsmiDYQEx6KdmME6c4-ah6A" },
]

[credits.expected_authorities]
identities = [
  { scheme = "ed25519", identifier = "nS5GC-Q7uZtXKg2sep2iHsmiDYQEx6KdmME6c4-ah6A" },
]

[negotiation]
# Empty: the inference guards prepend automatically; the terminal default is
# listed_price.
policies = []

[pricing]
default_min_price = "1"

[seed]
# On startup, register this quota resource in the authority's ledger and
# publish one listing from it, so a fresh `compose up` has something to
# discover. The quota is large enough that the deal scenario cannot close it.
resource_id = "stub-instruct-quota"
total_units = 100000
token       = "0x9fe46736679d2d9a65f0992f2272de9f3c7fa6e0"
chain       = "anvil"

[seed.model_card]
# The development model server is a deterministic stub built from this
# repository; the artifact reference names it as a fixture.
owner             = "arkhai"
name              = "stub-instruct"
artifact_ref      = "dev://arkhai/stub-instruct"
display_name      = "Arkhai stub instruct"
provenance        = "self-hosted"
served_model_name = "stub-instruct"
context_length    = 8192
quantization      = "none"
architecture      = { modality = "text->text", instruct_type = "chat" }
supported_parameters = ["max_tokens", "temperature", "stream"]
endpoint          = { base_url = "http://inference-gateway:8105/v1" }
# The gate charges one fixed amount per request, so the token and image rates are zero.
rate_card         = { prompt_credits_per_million = 0, completion_credits_per_million = 0, request_credits = 1 }
